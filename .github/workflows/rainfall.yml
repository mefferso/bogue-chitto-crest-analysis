name: Retrieve October 31 MRMS Rainfall
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-tools
          python -m pip install -r requirements.txt
      - name: Retrieve and process rainfall
        run: python scripts/rainfall.py
      - name: Commit generated rainfall
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rainfall.json
          if git diff --cached --quiet; then echo "No rainfall changes"; else git commit -m "Add MRMS Pass 2 rainfall archive analysis"; git push; fi
