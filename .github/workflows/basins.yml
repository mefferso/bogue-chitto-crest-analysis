name: Prepare USGS drainage basins
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/basins.py'
      - '.github/workflows/basins.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geography tools
        run: python -m pip install requests 'shapely>=2,<3'
      - name: Retrieve full USGS WBD units for existing events
        run: python scripts/basins.py --refresh --require-available
      - name: Upload prepared static assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usgs-drainage-basins
          path: data/basins/
          if-no-files-found: error
