name: Prepare USGS drainage basins
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/basins.py'
      - '.github/workflows/basins.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geography tools
        run: python -m pip install requests 'shapely>=2,<3'
      - name: Retrieve full USGS WBD units for existing events
        run: python scripts/basins.py --refresh --require-available
      - name: Upload prepared static assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usgs-drainage-basins
          path: data/basins/
          if-no-files-found: error
      - name: Publish prepared static geography on the selected branch
        if: github.event_name != 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/basins/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official USGS watershed reference assets"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
