name: Validate historical event code
on:
  push:
    branches:
      - feature/historical-event-library
  pull_request:
    paths:
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compile
        run: python -m compileall -q scripts
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          assert len(scripts)==1
          Path('/tmp/dashboard.js').write_text(scripts[0])
          PY
          node --check /tmp/dashboard.js
      - name: YAML parse and event index checks
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          for p in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(p.read_text())
          data=json.loads(Path('data/events.json').read_text())
          assert data['events'][0]['id']=='2026-10-31_pearl-river-ms'
          PY
