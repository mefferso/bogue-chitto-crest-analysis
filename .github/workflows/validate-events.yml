name: Validate historical event code
on:
  push:
    branches:
      - feature/historical-event-library
  pull_request:
    paths:
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compile
        run: python -m compileall -q scripts
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          scripts=[script for script in scripts if script.strip()]
          assert len(scripts)==1
          Path('/tmp/dashboard.js').write_text(scripts[0])
          PY
          node --check /tmp/dashboard.js
      - name: YAML parse and event index checks
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          for p in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(p.read_text())
          data=json.loads(Path('data/events.json').read_text())
          assert any(e['id']=='2026-10-31_pearl-river-ms' for e in data['events'])
          PY
      - name: Verify current NWS Orleans county and marine geometries
        run: |
          python -m pip install requests shapely
          python - <<'PY'
          import tempfile, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from boundary import generate
          from shapely.geometry import shape
          with tempfile.TemporaryDirectory() as d:
              land=generate('22071',Path(d)/'land.geojson',marine=False)
              marine=generate('22071',Path(d)/'marine.geojson',marine=True)
              assert land['properties']['mode']=='county'
              assert marine['properties']['marine_zones']
              assert shape(marine['geometry']).area>shape(land['geometry']).area
              print('NWS boundary query succeeded:',marine['properties']['marine_zones'])
          PY
