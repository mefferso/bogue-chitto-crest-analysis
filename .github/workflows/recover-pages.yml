name: Reinitialize GitHub Pages publishing source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  reset-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reassert existing Pages source without changing site files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          echo "Current publishing configuration:"
          gh api "repos/${GH_REPO}/pages" --jq '{build_type,status,source,html_url}'
          echo "Attempting non-destructive source reinitialization: legacy, main, root."
          gh api --method PUT "repos/${GH_REPO}/pages" \
            -f build_type=legacy \
            -f 'source[branch]=main' \
            -f 'source[path]=/' --include
          code=$?
          echo "Pages settings API exit code: ${code}"
          echo "Resulting configuration:"
          gh api "repos/${GH_REPO}/pages" --jq '{build_type,status,source,html_url}' || true
          exit "${code}"
